services:
  - type: web
    name: uzhavan-thunai-api
    env: docker
    dockerfilePath: ./Dockerfile
    region: singapore
    plan: free
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: sqlite:///./uzhavan_thunai.db
      - key: JWT_SECRET
        generateValue: true
