<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <radialGradient id="sunGlow" cx="60" cy="50" r="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FFF3D6"/>
      <stop offset="60%" stopColor="#FDE68A"/>
      <stop offset="100%" stopColor="#F59E0B"/>
    </radialGradient>
    <linearGradient id="bodyGrad" x1="60" y1="45" x2="60" y2="95" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#A7F3D0"/>
      <stop offset="50%" stopColor="#34D399"/>
      <stop offset="100%" stopColor="#059669"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="60" y1="10" x2="60" y2="45" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#86EFAC"/>
      <stop offset="100%" stopColor="#22C55E"/>
    </linearGradient>
    <filter id="cuteShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#064E3B" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Golden Sun Badge Background with Soft Rounded Ring -->
  <circle cx="60" cy="60" r="54" fill="url(#sunGlow)"/>
  <circle cx="60" cy="60" r="53" stroke="#FFFFFF" stroke-width="2.5" opacity="0.8"/>

  <!-- Fertile Soil Base Cushion -->
  <ellipse cx="60" cy="98" rx="36" ry="12" fill="#78350F" opacity="0.85"/>
  <ellipse cx="60" cy="96" rx="32" ry="8" fill="#92400E"/>

  <!-- Cute Mascot Sprout Body -->
  <path d="M42 88 C36 72 40 54 60 54 C80 54 84 72 78 88 C74 94 46 94 42 88 Z" fill="url(#bodyGrad)" filter="url(#cuteShadow)"/>

  <!-- Adorable Big Glossy Eyes -->
  <!-- Left Eye -->
  <ellipse cx="51" cy="70" rx="5" ry="6.5" fill="#064E3B"/>
  <circle cx="49.5" cy="67.5" r="2.2" fill="#FFFFFF"/>
  <circle cx="53" cy="72" r="1.1" fill="#FFFFFF"/>
  
  <!-- Right Eye -->
  <ellipse cx="69" cy="70" rx="5" ry="6.5" fill="#064E3B"/>
  <circle cx="67.5" cy="67.5" r="2.2" fill="#FFFFFF"/>
  <circle cx="71" cy="72" r="1.1" fill="#FFFFFF"/>

  <!-- Happy Smiling Mouth with Tongue -->
  <path d="M55 77 Q60 83 65 77" stroke="#064E3B" stroke-width="2" stroke-linecap="round" fill="#F43F5E"/>

  <!-- Cute Pink Blushing Cheeks -->
  <ellipse cx="44" cy="75" rx="3.5" ry="2" fill="#F43F5E" opacity="0.45"/>
  <ellipse cx="76" cy="75" rx="3.5" ry="2" fill="#F43F5E" opacity="0.45"/>

  <!-- Friendly Sprout Top Twin Leaves -->
  <!-- Left Twin Leaf -->
  <path d="M60 54 C46 44 42 24 55 18 C64 24 64 42 60 54 Z" fill="url(#leafGrad)"/>
  <!-- Right Twin Leaf with Cute Dew Drop -->
  <path d="M60 52 C74 42 86 26 75 16 C66 22 62 40 60 52 Z" fill="#16A34A"/>
  
  <!-- Glistening Dewdrop on Leaf -->
  <circle cx="72" cy="24" r="2.2" fill="#FFFFFF" opacity="0.9"/>

  <!-- Little Farmer Headband / Golden Sparkle -->
  <path d="M43 57 Q60 52 77 57" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="60" cy="54" r="2.5" fill="#EF4444"/>
</svg>
