services:
  - type: web
    name: uzhavan-thunai-api
    env: python
    region: singapore
    plan: free
    buildCommand: "pip install -r requirements.txt && python data/seed_db.py"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: sqlite:///./uzhavan_thunai.db
      - key: JWT_SECRET
        generateValue: true
